<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" role="img" aria-labelledby="title desc">
  <title id="title">Schematische weibliche Körperansicht von hinten</title>
  <desc id="desc">Neutrale, weich gezeichnete und segmentierte Körperkarte zur Auswahl von Schmerzregionen.</desc>
  <style>
    .body-region {
      fill: #f3d9c6;
      stroke: #59645f;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .body-detail {
      fill: none;
      stroke: rgb(55 65 81 / 22%);
      stroke-width: 1.5;
      stroke-linecap: round;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }
    .body-detail circle {
      fill: rgb(55 65 81 / 22%);
      stroke: none;
    }
  </style>

  <g id="back" data-view="back">
    <path id="back-head" data-region="head" class="body-region" d="head"/>
    <path id="back-neck" data-region="neck" class="body-region" d="neck"/>
    <path id="back-upper-back" data-region="upper-back" class="body-region" d="upper-back"/>
    <path id="back-lower-back" data-region="lower-back" class="body-region" d="lower-back"/>
    <path id="back-left-glute" data-region="left-glute" class="body-region" d="left-glute"/>
    <path id="back-right-glute" data-region="right-glute" class="body-region" d="right-glute"/>
    <path id="back-left-shoulder" data-region="left-shoulder" class="body-region" d="left-shoulder"/>
    <path id="back-left-upper-arm" data-region="left-upper-arm" class="body-region" d="left-upper-arm"/>
    <path id="back-left-elbow" data-region="left-elbow" class="body-region" d="left-elbow"/>
    <path id="back-left-forearm" data-region="left-forearm" class="body-region" d="left-forearm"/>
    <path id="back-left-hand" data-region="left-hand" class="body-region" d="left-hand"/>
    <path id="back-right-shoulder" data-region="right-shoulder" class="body-region" d="right-shoulder"/>
    <path id="back-right-upper-arm" data-region="right-upper-arm" class="body-region" d="right-upper-arm"/>
    <path id="back-right-elbow" data-region="right-elbow" class="body-region" d="right-elbow"/>
    <path id="back-right-forearm" data-region="right-forearm" class="body-region" d="right-forearm"/>
    <path id="back-right-hand" data-region="right-hand" class="body-region" d="right-hand"/>
    <path id="back-left-thigh" data-region="left-thigh" class="body-region" d="left-thigh"/>
    <path id="back-right-thigh" data-region="right-thigh" class="body-region" d="right-thigh"/>
    <path id="back-left-knee" data-region="left-knee" class="body-region" d="left-knee"/>
    <path id="back-right-knee" data-region="right-knee" class="body-region" d="right-knee"/>
    <path id="back-left-calf" data-region="left-calf" class="body-region" d="left-calf"/>
    <path id="back-right-calf" data-region="right-calf" class="body-region" d="right-calf"/>
    <path id="back-left-ankle" data-region="left-ankle" class="body-region" d="left-ankle"/>
    <path id="back-right-ankle" data-region="right-ankle" class="body-region" d="right-ankle"/>
    <path id="back-left-foot" data-region="left-foot" class="body-region" d="left-foot"/>
    <path id="back-right-foot" data-region="right-foot" class="body-region" d="right-foot"/>
    <g class="body-detail" aria-hidden="true">
      <path d="M160 137 C158 177 158 220 160 278"/>
      <path d="M132 158 Q145 149 152 165"/>
      <path d="M188 158 Q175 149 168 165"/>
    </g>
  </g>
</svg>
