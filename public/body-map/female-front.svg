<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" role="img" aria-labelledby="title desc">
  <title id="title">Schematische weibliche Körperansicht von vorn</title>
  <desc id="desc">Neutrale, weich gezeichnete und segmentierte Körperkarte zur Auswahl von Schmerzregionen.</desc>
  <style>
    .body-region {
      fill: #f3d9c6;
      stroke: #59645f;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .body-detail {
      fill: none;
      stroke: rgb(55 65 81 / 22%);
      stroke-width: 1.5;
      stroke-linecap: round;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }
    .body-detail circle {
      fill: rgb(55 65 81 / 22%);
      stroke: none;
    }
  </style>

  <g id="front" data-view="front">
    <path id="front-head" data-region="head" class="body-region" d="head"/>
    <path id="front-neck" data-region="neck" class="body-region" d="neck"/>
    <path id="front-chest" data-region="chest" class="body-region" d="chest"/>
    <path id="front-abdomen" data-region="abdomen" class="body-region" d="abdomen"/>
    <path id="front-pelvis" data-region="pelvis" class="body-region" d="pelvis"/>
    <path id="front-left-shoulder" data-region="left-shoulder" class="body-region" d="left-shoulder"/>
    <path id="front-left-upper-arm" data-region="left-upper-arm" class="body-region" d="left-upper-arm"/>
    <path id="front-left-elbow" data-region="left-elbow" class="body-region" d="left-elbow"/>
    <path id="front-left-forearm" data-region="left-forearm" class="body-region" d="left-forearm"/>
    <path id="front-left-hand" data-region="left-hand" class="body-region" d="left-hand"/>
    <path id="front-right-shoulder" data-region="right-shoulder" class="body-region" d="right-shoulder"/>
    <path id="front-right-upper-arm" data-region="right-upper-arm" class="body-region" d="right-upper-arm"/>
    <path id="front-right-elbow" data-region="right-elbow" class="body-region" d="right-elbow"/>
    <path id="front-right-forearm" data-region="right-forearm" class="body-region" d="right-forearm"/>
    <path id="front-right-hand" data-region="right-hand" class="body-region" d="right-hand"/>
    <path id="front-left-thigh" data-region="left-thigh" class="body-region" d="left-thigh"/>
    <path id="front-right-thigh" data-region="right-thigh" class="body-region" d="right-thigh"/>
    <path id="front-left-knee" data-region="left-knee" class="body-region" d="left-knee"/>
    <path id="front-right-knee" data-region="right-knee" class="body-region" d="right-knee"/>
    <path id="front-left-lower-leg" data-region="left-lower-leg" class="body-region" d="left-lower-leg"/>
    <path id="front-right-lower-leg" data-region="right-lower-leg" class="body-region" d="right-lower-leg"/>
    <path id="front-left-ankle" data-region="left-ankle" class="body-region" d="left-ankle"/>
    <path id="front-right-ankle" data-region="right-ankle" class="body-region" d="right-ankle"/>
    <path id="front-left-foot" data-region="left-foot" class="body-region" d="left-foot"/>
    <path id="front-right-foot" data-region="right-foot" class="body-region" d="right-foot"/>
    <g class="body-detail" aria-hidden="true">
      <path d="M137 151 Q149 144 160 151 Q171 144 183 151"/>
      <path d="M160 232 C157 246 157 263 160 279"/>
      <circle cx="160" cy="263" r="2.6"/>
    </g>
  </g>
</svg>
