name: Temporary final E2E assurance remediation

on:
  push:
    branches:
      - codex/fix-one-shot-envelope-crash-safety
    paths:
      - .github/local-wrap-build-fix-trigger

permissions:
  contents: write

jobs:
  remediate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-one-shot-envelope-crash-safety
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final remediation
        run: node scripts/fix-local-wrap-build.mjs
      - name: Check diff
        run: git diff --check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/localDatabase.ts tests
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Fix encrypted pain-type identity and E2E assumptions"
          git push origin HEAD:codex/fix-one-shot-envelope-crash-safety
      - run: npm ci
      - name: Unit suite
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Re-run remaining Chromium specs
        run: >-
          npx playwright test
          tests/activity-help.spec.ts
          tests/activity-page.spec.ts
          tests/medication-entry.spec.ts
          tests/pain-entry-flow.spec.ts
          tests/pain-entry-list.spec.ts
          --project=chromium --workers=1
