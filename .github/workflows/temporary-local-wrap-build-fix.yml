name: Temporary Storybook and Playwright validation

on:
  push:
    branches:
      - codex/fix-one-shot-envelope-crash-safety
    paths:
      - .github/local-wrap-build-fix-trigger

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-one-shot-envelope-crash-safety
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Storybook build
        run: npm run build-storybook
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright all configured projects
        run: npm run test:e2e
