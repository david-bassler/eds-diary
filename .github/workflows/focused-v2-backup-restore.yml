name: Focused V2 Backup Restore E2E

on:
  push:
    branches:
      - codex/continue-v2-end-to-end-assurance-program-2fpbao
    paths:
      - .github/workflows/focused-v2-backup-restore.yml
      - src/data/backupRestoreV2Service.ts
      - src/data/localDatabase.ts
      - tests/productive-v2-backup-restore.spec.ts
      - tests/support/multiDeviceHarness.ts
  workflow_dispatch:

permissions:
  contents: read

# Focused, separate evidence; this does not replace full Security Validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    name: Backup Restore (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chrome]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Focused productive BackupV6 Restore tests
        run: npx playwright test tests/productive-v2-backup-restore.spec.ts --project=${{ matrix.project }} --workers=2 --retries=0 --reporter=line
      - name: Upload redacted Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focused-backup-restore-${{ matrix.project }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
