name: Temporary auth remediation

on:
  push:
    branches:
      - codex/fix-one-shot-envelope-crash-safety
    paths:
      - .github/auth-remediation-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger auth boundary remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: codex/fix-one-shot-envelope-crash-safety

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply remediation
        run: node scripts/remediate-auth-boundary.mjs

      - name: Validate patch shape
        run: git diff --check

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sync/google/GoogleSheetsSingleWriterTransport.ts src/sync/core/remoteVerifier.ts src/test/architecture.test.ts src/test/googleAuthBoundary.test.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Harden authenticated Google capability boundary"
          git push origin HEAD:codex/fix-one-shot-envelope-crash-safety

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security-path lint
        run: npx eslint src/data src/security src/sync src/test
