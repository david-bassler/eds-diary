name: Temporary explicit conflict merge remediation

on:
  push:
    branches:
      - codex/fix-one-shot-envelope-crash-safety
    paths:
      - .github/locking-migration-remediation-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger locking migration remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-one-shot-envelope-crash-safety
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply remediation
        run: node scripts/remediate-locking-migration.mjs
      - name: Validate patch shape
        run: git diff --check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/localDatabase.ts src/test/conflictMerge.test.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Add explicit record conflict merge path"
          git push origin HEAD:codex/fix-one-shot-envelope-crash-safety
      - run: npm ci
      - name: Conflict merge tests
        run: npx vitest run src/test/conflictMerge.test.ts src/test/revisions.test.ts src/test/localDatabase.test.ts
      - name: Full unit suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Security lint
        run: npx eslint src/data src/security src/sync src/test
