name: Temporary recovery bootstrap remediation

on:
  push:
    branches:
      - codex/fix-one-shot-envelope-crash-safety
    paths:
      - .github/recovery-bootstrap-remediation-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger recovery bootstrap remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-one-shot-envelope-crash-safety
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply remediation
        run: node scripts/remediate-recovery-bootstrap.mjs
      - name: Validate patch shape
        run: git diff --check
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sync/core/remoteVerifier.ts src/security/recovery.ts src/data/productiveRotationService.ts src/test/recovery-rotation.test.ts
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Implement verified backup recovery bootstrap"
          git push origin HEAD:codex/fix-one-shot-envelope-crash-safety
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Security lint
        run: npx eslint src/data src/security src/sync src/test
