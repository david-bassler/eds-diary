name: Finalize abdomen integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-abdomen.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch body map
        run: python scripts/finalize_abdomen_body.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        env:
          VITE_BASE_PATH: /eds-diary/
        run: npm run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pain/bodyMap/BodyMapSelector.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate abdomen detail selector"
          git push origin HEAD:main
