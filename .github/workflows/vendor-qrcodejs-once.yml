name: Vendor QRCode.js once

on:
  push:
    paths:
      - '.github/workflows/vendor-qrcodejs-once.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Vendor pinned QRCode.js and remove CDN runtime dependency
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --branch "$GITHUB_REF_NAME" --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo

          mkdir -p public/vendor/qrcodejs
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/davidshimjs/qrcodejs/04f46c6a0708418cb7b96fc563eacae0fbf77674/qrcode.min.js' \
            -o public/vendor/qrcodejs/qrcode.min.js
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/davidshimjs/qrcodejs/04f46c6a0708418cb7b96fc563eacae0fbf77674/LICENSE' \
            -o public/vendor/qrcodejs/LICENSE

          verify_git_blob() {
            local file="$1" expected="$2" actual size
            size="$(wc -c < "$file" | tr -d ' ')"
            actual="$( (printf 'blob %s\0' "$size"; cat "$file") | sha1sum | awk '{print $1}')"
            test "$actual" = "$expected"
          }
          verify_git_blob public/vendor/qrcodejs/qrcode.min.js 993e88f396640f881b69f98db7a4d17401ef83ca
          verify_git_blob public/vendor/qrcodejs/LICENSE 93c33233fa538ff9af27374eb13c6ea5147f7a3e

          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text()
          old = '<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>'
          new = '<script src="./vendor/qrcodejs/qrcode.min.js" defer></script>'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one qrcodejs CDN script in index.html')
          index.write_text(text.replace(old, new))

          sw = Path('public/sw.js')
          text = sw.read_text()
          match = re.search(r"const CACHE_NAME = 'eds-diary-shell-v(\d+)'", text)
          if not match:
              raise SystemExit('Could not find EDS cache version')
          version = int(match.group(1)) + 1
          text = text[:match.start()] + f"const CACHE_NAME = 'eds-diary-shell-v{version}'" + text[match.end():]
          marker = "  './manifest.webmanifest',\n"
          asset = "  './vendor/qrcodejs/qrcode.min.js',\n"
          if asset not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Could not place vendored QRCode.js in app shell')
              text = text.replace(marker, marker + asset)
          sw.write_text(text)
          PY

          node --check public/vendor/qrcodejs/qrcode.min.js
          test "$(grep -R --exclude-dir=.git --exclude=vendor-qrcodejs-once.yml -l 'cdn.jsdelivr.net/npm/qrcodejs' . | wc -l)" -eq 0
          grep -q './vendor/qrcodejs/qrcode.min.js' index.html
          grep -q './vendor/qrcodejs/qrcode.min.js' public/sw.js

          rm .github/workflows/vendor-qrcodejs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html public/sw.js public/vendor/qrcodejs .github/workflows/vendor-qrcodejs-once.yml
          git commit -m 'security: serve qrcodejs from same origin'
          git push origin "HEAD:${GITHUB_REF_NAME}"
