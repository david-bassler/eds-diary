name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Fetch original OpenClipart silhouettes
        run: |
          curl --fail --show-error --silent --location --retry 4 --retry-all-errors \
            -H "Accept: image/svg+xml,*/*;q=0.8" \
            -A "Mozilla/5.0" \
            https://openclipart.org/download/14567 \
            --output /tmp/female-front-original.svg
          curl --fail --show-error --silent --location --retry 4 --retry-all-errors \
            -H "Accept: image/svg+xml,*/*;q=0.8" \
            -A "Mozilla/5.0" \
            https://openclipart.org/download/14565 \
            --output /tmp/female-back-original.svg
          grep -q "<svg" /tmp/female-front-original.svg
          grep -q "<svg" /tmp/female-back-original.svg
          echo "-----FRONT-SVG-BEGIN-----"
          cat /tmp/female-front-original.svg
          echo
          echo "-----FRONT-SVG-END-----"
          echo "-----BACK-SVG-BEGIN-----"
          cat /tmp/female-back-original.svg
          echo
          echo "-----BACK-SVG-END-----"

      - name: Build
        env:
          VITE_BASE_PATH: /eds-diary/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed page
        run: |
          echo "Checking ${{ steps.deployment.outputs.page_url }}"
          curl --fail --show-error --silent --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --output /tmp/eds-diary.html \
            "${{ steps.deployment.outputs.page_url }}"
          test -s /tmp/eds-diary.html
          grep -q "EDS Schmerztagebuch" /tmp/eds-diary.html
          if grep -q "/src/main.tsx" /tmp/eds-diary.html; then
            echo "GitHub Pages is serving repository source instead of the Vite build."
            exit 1
          fi
          if grep -q "%BASE_URL%" /tmp/eds-diary.html; then
            echo "GitHub Pages is serving unprocessed HTML."
            exit 1
          fi
