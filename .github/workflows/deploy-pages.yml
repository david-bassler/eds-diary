name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          VITE_BASE_PATH: /eds-diary/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed page
        run: |
          echo "Checking ${{ steps.deployment.outputs.page_url }}"
          curl --fail --show-error --silent --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --output /tmp/eds-diary.html \
            "${{ steps.deployment.outputs.page_url }}"
          test -s /tmp/eds-diary.html
          grep -q "EDS Schmerztagebuch" /tmp/eds-diary.html
          if grep -q "/src/main.tsx" /tmp/eds-diary.html; then
            echo "GitHub Pages is serving repository source instead of the Vite build."
            exit 1
          fi
          if grep -q "%BASE_URL%" /tmp/eds-diary.html; then
            echo "GitHub Pages is serving unprocessed HTML."
            exit 1
          fi
          base_url="${{ steps.deployment.outputs.page_url }}"
          for file in front-gray.png front-hitmap.png back-gray.png back-hitmap.png; do
            curl --fail --show-error --silent --location \
              --output "/tmp/${file}" "${base_url}body-map/${file}?verify=${{ github.sha }}"
            test -s "/tmp/${file}"
            signature="$(od -An -t x1 -N 8 "/tmp/${file}" | tr -d ' \n')"
            test "$signature" = "89504e470d0a1a0a"
          done
          for file in head-front-hitmap.png head-back-hitmap.png shoulder-right-hitmap.png hip-right-hitmap.png knee-front-right-hitmap.png knee-back-right-hitmap.png lower-back-hitmap.png foot-dorsal-right-hitmap.png foot-plantar-right-hitmap.png; do
            curl --fail --show-error --silent --location \
              --output "/tmp/${file}" "${base_url}body-map/details/${file}?verify=${{ github.sha }}"
            test -s "/tmp/${file}"
            signature="$(od -An -t x1 -N 8 "/tmp/${file}" | tr -d ' \n')"
            test "$signature" = "89504e470d0a1a0a"
          done
          echo "714d4607f2196260b9ea4c310592210ae8268c5da3d62cf962ece899154a2d53  /tmp/head-front-hitmap.png" | sha256sum -c -
          echo "303ee1d4d3d06e301873f32a75db0dd84663f4508bb8037a1274beb5bb5ea22f  /tmp/head-back-hitmap.png" | sha256sum -c -
          echo "0d9c6c0dc5935351e04f68bc9e6c02b5b617b17b0db76f824659cec88db97e2b  /tmp/shoulder-right-hitmap.png" | sha256sum -c -
          echo "fa501c4b705df1a6c4da39e22f4d4a0ab5dd03e35e882d3a4eba9e83c01683f9  /tmp/hip-right-hitmap.png" | sha256sum -c -
          echo "18e1f8369659f5ac224d5ef9e320798b392803afacebdea70ac0518ac13f0b5b  /tmp/knee-front-right-hitmap.png" | sha256sum -c -
          echo "6c9e17b4a5a939b36374522be01e31be3c8122808059d2c67b7d377fbe4d63da  /tmp/knee-back-right-hitmap.png" | sha256sum -c -
          echo "29972766ad34b0ecf25bd658cff1a4dd3f92b27487652043e77ddf073bad8023  /tmp/lower-back-hitmap.png" | sha256sum -c -
          echo "e6939a24cfa36b87b623eefb6ade8f8b1be12d9a639dc0b2193f08f3ae9f897b  /tmp/foot-dorsal-right-hitmap.png" | sha256sum -c -
          echo "926ae2e4525531093173e6a5ae27e432fb1e751661209112c98766e304a41222  /tmp/foot-plantar-right-hitmap.png" | sha256sum -c -
