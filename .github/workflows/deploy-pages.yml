name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          VITE_BASE_PATH: /eds-diary/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed page
        run: |
          echo "Checking ${{ steps.deployment.outputs.page_url }}"
          curl --fail --show-error --silent --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            --output /tmp/eds-diary.html \
            "${{ steps.deployment.outputs.page_url }}"
          test -s /tmp/eds-diary.html
          grep -q "EDS Schmerztagebuch" /tmp/eds-diary.html
          if grep -q "/src/main.tsx" /tmp/eds-diary.html; then
            echo "GitHub Pages is serving repository source instead of the Vite build."
            exit 1
          fi
          if grep -q "%BASE_URL%" /tmp/eds-diary.html; then
            echo "GitHub Pages is serving unprocessed HTML."
            exit 1
          fi
          base_url="${{ steps.deployment.outputs.page_url }}"
          curl --fail --show-error --silent --location \
            --output /tmp/female-front.svg "${base_url}body-map/female-front.svg"
          curl --fail --show-error --silent --location \
            --output /tmp/female-back.svg "${base_url}body-map/female-back.svg"
          grep -q 'viewBox="0 0 138.04 441.27"' /tmp/female-front.svg
          grep -q 'viewBox="0 0 108.5 421.5"' /tmp/female-back.svg
